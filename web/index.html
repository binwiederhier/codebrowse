<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codebrowse</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="tb-left">
      <div class="logo">CB</div>
      <button class="tb-widget" id="tbProject"><span class="pbadge" id="tbProjBadge">?</span><span id="tbProjName">No project</span><span class="chev-d"></span></button>
      <div class="tb-widget static" id="tbBranch" title="Git branch of the current file"><svg viewBox="0 0 16 16" width="15" height="15"><circle cx="5" cy="3.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="5" cy="12.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="11.5" cy="5.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M5 5.1v5.8M11.5 7.1c0 2.4-2 3-4.2 3.6-1 .3-1.8.8-2.1 1.3" fill="none" stroke="currentColor" stroke-width="1.2"/></svg><span id="tbBranchName"></span></div>
    </div>
    <div class="tb-right">
      <span class="tb-status" id="tbStatus"></span>
      <button class="tb-icon" id="tbSearch" title="Search Everywhere (Double Shift / Ctrl+P)"><svg viewBox="0 0 16 16" width="16" height="16"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10.4 10.4l3.6 3.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
      <button class="tb-icon" id="tbHelp" title="Keyboard shortcuts"><svg viewBox="0 0 16 16" width="16" height="16"><rect x="1.5" y="4" width="13" height="8.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M4 7h1M7 7h1M10 7h2M4 9.7h8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
    </div>
  </header>
  <div id="main">
    <aside id="sidebar">
      <div class="panel-head">
        <button id="projBtn" class="proj-btn" title="Switch or add project"><span id="projBtnName">Project</span><span class="chev-d"></span></button>
        <div class="panel-actions">
          <button class="icon-btn" id="btnLocate" title="Select Opened File (Alt+F1)"><svg viewBox="0 0 16 16" width="16" height="16"><circle cx="8" cy="8" r="5.3" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="8" cy="8" r="1.6" fill="currentColor"/><path d="M8 1v2.5M8 12.5V15M1 8h2.5M12.5 8H15" stroke="currentColor" stroke-width="1.2"/></svg></button>
          <button class="icon-btn" id="btnCollapse" title="Collapse All"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M4.5 3.5L8 7l3.5-3.5M4.5 12.5L8 9l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
      </div>
      <div id="tree" tabindex="0"></div>
    </aside>
    <div class="splitter v" id="splitSide"></div>
    <section id="center">
      <div id="tabs"></div>
      <div id="editorWrap">
        <div id="empty" class="empty">
          <div class="empty-inner">
            <div><span>Search Everywhere</span><kbd>Double Shift</kbd></div>
            <div><span>Go to File</span><kbd>Ctrl+P</kbd></div>
            <div><span>Recent Files</span><kbd>Ctrl+E</kbd></div>
            <div><span>Go to Declaration</span><kbd>Ctrl+Click</kbd></div>
            <div><span>Show Usages</span><kbd>Ctrl+G</kbd></div>
          </div>
        </div>
      </div>
      <div id="crumbs"></div>
      <div class="splitter h hidden" id="splitBottom"></div>
      <div id="bottom" class="hidden">
        <div class="bhead">
          <span class="btitle" id="bTitle">Usages</span>
          <span class="bcount" id="bCount"></span>
          <span class="spacer"></span>
          <button class="icon-btn" id="bClose" title="Close (Esc)"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
        </div>
        <div class="blist" id="bList" tabindex="0"></div>
      </div>
    </section>
  </div>
  <footer id="statusbar">
    <div id="sbCrumbs" class="sb-crumbs"></div>
    <div class="sb-right">
      <button id="sbLink" class="sb-link hidden" title="Copy link"><svg viewBox="0 0 16 16" width="13" height="13"><path d="M6.6 9.4a2.6 2.6 0 003.7 0l2.4-2.4a2.6 2.6 0 00-3.7-3.7l-.9.9M9.4 6.6a2.6 2.6 0 00-3.7 0L3.3 9a2.6 2.6 0 003.7 3.7l.9-.9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>Copy Link</button>
      <span id="sbPos"></span>
      <span>LF</span>
      <span>UTF-8</span>
      <span id="sbIndent">Tab</span>
      <span id="sbGopls" class="sb-gopls"></span>
    </div>
  </footer>
</div>
<div id="menu" class="menu hidden"></div>
<div id="popup" class="popup hidden"></div>
<div id="toast" class="toast hidden"></div>
<div id="modalBack" class="modal-back hidden"></div>
<script src="app.js"></script>
</body>
</html>
